[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sqlite-agentic-rl-v2"
version = "0.1.0"
description = "An executable SQLite environment for SFT and agentic GRPO experiments."
readme = "README.md"
requires-python = ">=3.10"

[project.optional-dependencies]
sft = [
  "datasets>=3.0",
  "peft>=0.16",
  "torch>=2.5",
  "transformers>=4.51",
  "wandb>=0.19",
]
data = [
  "pandas>=2.2",
  "pyarrow>=17",
]
dev = [
  "pytest>=8",
]

[tool.setuptools]
package-dir = {"" = "sqlite_agent"}

[tool.setuptools.packages.find]
where = ["sqlite_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
